services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: baronaerial-site:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Optional: Set DATABASE_URL in Portainer for mission brief persistence.
      # Leave unset to use embedded PGLite fallback (data lost on restart).
      DATABASE_URL: ${DATABASE_URL:-}
      # Optional: Mission brief delivery configuration (requires DATABASE_URL to be set).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MISSION_BRIEF_FROM: ${MISSION_BRIEF_FROM:-}
      MISSION_BRIEF_TO: ${MISSION_BRIEF_TO:-}
      MISSION_BRIEF_RATE_SECRET: ${MISSION_BRIEF_RATE_SECRET:-}
      MISSION_BRIEF_TRUST_PROXY: ${MISSION_BRIEF_TRUST_PROXY:-}
    expose:
      - "3000"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
