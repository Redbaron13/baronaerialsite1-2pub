services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: baronaerial-site:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      RESEND_API_KEY: ${RESEND_API_KEY:?Set this in Portainer}
      MISSION_BRIEF_FROM: ${MISSION_BRIEF_FROM:?Set a verified Resend sender}
      MISSION_BRIEF_TO: ${MISSION_BRIEF_TO:?Set the inquiry inbox}
    expose:
      - "3000"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
