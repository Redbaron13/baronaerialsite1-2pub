services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: baronaerial-site:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set a persistent PostgreSQL connection}
      MISSION_BRIEF_TRUST_PROXY: ${MISSION_BRIEF_TRUST_PROXY:-}
      MISSION_BRIEF_RATE_SECRET: ${MISSION_BRIEF_RATE_SECRET:-}
    expose:
      - "3000"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
