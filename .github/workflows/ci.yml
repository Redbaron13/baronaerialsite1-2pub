name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check auth invariants
        run: npm run check:auth

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build production output
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke-test production preview
        env:
          BAM_TEST_URL: http://127.0.0.1:8081
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 8081 > /tmp/baron-site-preview.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BAM_TEST_URL/" >/dev/null; then
              npm run verify:site
              exit 0
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat /tmp/baron-site-preview.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/baron-site-preview.log
          echo "Production preview did not become ready in 60 seconds."
          exit 1
